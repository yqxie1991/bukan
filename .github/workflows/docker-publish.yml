name: Build and Push Docker Image

on:
  # 推送 v* 标签时：构建并推送镜像，然后创建对应的 GitHub Release
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 也保留在 GitHub Actions 页面手动触发的能力
    inputs:
      version:
        description: 'Docker 镜像的版本号 (例如: v1.0.0)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release 需要（仅标签触发时用到）
      packages: write # 赋予流水线写入 GitHub 镜像仓库的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 使用内置令牌自动登录

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 标签规则：手动触发用输入的版本号；标签触发时自动取标签名（如 v2.0-lite）
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.version || github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 刻意放在镜像构建成功之后：镜像没推上去就不该发布 Release。
      # 仅标签触发时执行（手动 workflow_dispatch 不建 Release）。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # 幂等：若该 tag 的 Release 已存在（例如你已在网页手动发布），跳过而不报错
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，跳过创建。"
            exit 0
          fi

          # --generate-notes：由 GitHub 依据「上一个 Release 之后的提交」自动生成发布说明
          # 末尾附加 docker-compose.yml，方便直接下载部署（与此前手动发布的做法一致）
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            docker-compose.yml
