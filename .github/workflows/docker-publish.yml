name: Build and Push Docker Image

on:
  # 推送 v* 标签时自动构建并推送镜像（发版不再需要手动触发）
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 也保留在 GitHub Actions 页面手动触发的能力
    inputs:
      version:
        description: 'Docker 镜像的版本号 (例如: v1.0.0)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 赋予流水线写入 GitHub 镜像仓库的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 使用内置令牌自动登录

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 标签规则：手动触发用输入的版本号；标签触发时自动取标签名（如 v2.0-lite）
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.version || github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
